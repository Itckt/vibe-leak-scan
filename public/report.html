<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>掃描報告 · 漏唔漏</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/styles.css"><script type="module" src="/report.js"></script>
  <script type="module" src="/service-status.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">跳至報告內容</a>
  <header class="site-header"><a class="brand" href="/" aria-label="漏唔漏首頁"><span class="brand-mark" aria-hidden="true">漏</span>漏唔漏<span class="version">第一版</span></a><a class="back-link" href="/">← 掃描另一個網站</a></header>
  <main id="main" class="report-layout">
    <p id="service-notice" class="notice-box" hidden></p>
    <p id="report-status" role="status" class="loading-text">正在讀取掃描報告…</p>
    <div id="report-content" hidden>
      <div class="report-heading"><div><p class="eyebrow">讓問題變成下一步</p><h1>網站安全報告</h1><p id="report-target" class="report-target"></p></div><button id="copy-plan" class="button secondary" type="button">複製整份修復計劃</button><button id="copy-link" class="button secondary" type="button">複製報告連結</button></div>
      <section id="plan-fallback" class="plan-fallback" hidden><label for="plan-text">無法自動複製，請選取以下完整修復計劃並手動複製。</label><textarea id="plan-text" readonly rows="12"></textarea></section><section class="report-overview" aria-labelledby="summary-heading"><div class="grade-block"><span>整體評級</span><strong id="grade"></strong><small>依已完成的檢查評估</small></div><div class="summary-block"><p id="report-meta" class="eyebrow"></p><h2 id="summary-heading"></h2><div id="severity-counts" class="severity-counts"></div><p id="report-coverage" class="hint"></p></div></section>
      <div class="platform-row"><span class="muted">平台特徵推測</span><div id="platforms" class="chips"></div><span class="hint">僅供參考</span></div>
      <div id="report-notices" class="notice-box" hidden><h2>檢查範圍與未完成項目</h2><ul id="notice-list"></ul></div>
      <section class="tool-panel" aria-label="修復工具"><label for="prompt-tool">你用哪個工具做這個網站？</label><select id="prompt-tool"><option value="lovable">Lovable</option><option value="bolt">Bolt</option><option value="replit">Replit</option><option value="agent">程式碼代理（Cursor、Claude Code 等）</option><option value="generic">其他</option></select></section><section aria-labelledby="findings-title"><div class="findings-heading"><h2 id="findings-title">需要留意的問題</h2><span class="hint">按嚴重程度排序</span></div><div id="filters" class="filters" role="group" aria-label="依嚴重程度篩選"></div><div id="findings" class="findings"></div><p id="empty-findings" class="empty-state" hidden>這個篩選條件下沒有問題。</p></section>
      <section id="database-section" class="database-section" hidden><h2>匿名資料權限檢查</h2><p class="hint">拒絕存取或空回應，都不能單獨證明所有 RLS 政策安全。</p><div class="table-wrap"><table><thead><tr><th scope="col">專案</th><th scope="col">資料表</th><th scope="col">檢查結果</th></tr></thead><tbody id="database-checks"></tbody></table></div></section>
      <aside class="report-footnote"><p id="limitations"></p><p>報告網址使用隨機識別碼。知道連結的人可以閱讀報告，請只分享給需要處理問題的人。</p></aside>
    </div>
  </main>
  <template id="finding-template"><article class="finding-card"><div class="finding-top"><span class="severity-badge"></span><span class="finding-index"></span></div><h3></h3><p class="finding-description"></p><div class="finding-evidence" hidden></div><dl><div><dt>為甚麼有風險</dt><dd class="finding-why"></dd></div><div><dt>可以怎樣修</dt><dd class="finding-fix"></dd></div></dl><p class="finding-source"></p><details class="prompt-panel"><summary>查看 AI 修復指令</summary><p class="prompt-text" tabindex="-1"></p></details><p class="manual-step notice-box" hidden></p><button class="button copy-prompt" type="button">複製修復指令</button></article></template>
  <footer>漏唔漏 <span>·</span> 把風險說清楚，把修復做起來。</footer>
</body>
</html>
